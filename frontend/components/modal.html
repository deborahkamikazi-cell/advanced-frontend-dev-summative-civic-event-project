<div id="global-modal-overlay" class="fixed inset-0 z-[60] hidden bg-black/50 p-4">
  <div class="grid min-h-full place-items-center">
    <div id="global-modal-panel" role="dialog" aria-modal="true" class="ce-card w-full max-w-sm p-6">
      <h2 id="global-modal-title" class="text-lg font-semibold">Confirm action</h2>
      <p id="global-modal-message" class="mt-1 text-sm text-slate-500">Are you sure?</p>
      <div class="mt-5 flex justify-end gap-2">
        <button id="global-modal-cancel" class="ce-btn-secondary">Cancel</button>
        <button id="global-modal-confirm" class="ce-btn-danger">Confirm</button>
      </div>
    </div>
  </div>
</div>
