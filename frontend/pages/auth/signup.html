<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup | CivicEvents+</title>
    <link rel="stylesheet" href="../../css/output.css" />
  </head>
  <body class="min-h-screen bg-gray-50 text-gray-900">
    <main class="mx-auto flex min-h-screen max-w-md items-center justify-center p-4">
      <section class="w-full rounded-lg border border-gray-200 bg-white p-6 shadow-sm">
        <h1 class="mb-4 text-xl font-semibold">Create Account</h1>
        <form id="signup-form" class="space-y-4" novalidate>
          <div>
            <label for="full_name" class="mb-1 block text-sm font-medium">Full name</label>
            <input id="full_name" name="full_name" type="text" class="w-full rounded border px-3 py-2" required />
          </div>
          <div>
            <label for="email" class="mb-1 block text-sm font-medium">Email</label>
            <input id="email" name="email" type="email" class="w-full rounded border px-3 py-2" required />
          </div>
          <div>
            <label for="password" class="mb-1 block text-sm font-medium">Password</label>
            <input id="password" name="password" type="password" class="w-full rounded border px-3 py-2" required />
            <p id="password-strength" class="mt-1 text-xs text-gray-500" aria-live="polite"></p>
          </div>
          <button type="submit" class="w-full rounded bg-gray-900 px-4 py-2 text-sm text-white">Sign up</button>
        </form>
      </section>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="../../js/pages/signup.js"></script>
  </body>
</html>
