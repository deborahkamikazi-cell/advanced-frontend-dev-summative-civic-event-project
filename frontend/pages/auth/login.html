<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | CivicEvents+</title>
    <link rel="stylesheet" href="../../css/output.css" />
  </head>
  <body class="min-h-screen bg-gray-50 text-gray-900">
    <main class="min-h-screen lg:grid lg:grid-cols-2">
      <section class="hidden flex-col justify-end p-12 text-white lg:flex" style="background:linear-gradient(160deg,#172554,#2563EB 70%,#F59E0B)">
        <div class="text-6xl">🤝</div>
        <h2 class="mt-4 text-3xl font-bold">Your community, in one place.</h2>
        <p class="mt-2 text-blue-100">Discover civic events, listen to announcements and take part.</p>
      </section>
      <section class="flex items-center justify-center p-6">
        <form id="login-form" class="w-full max-w-sm space-y-4" novalidate>
          <a href="/index.html" class="mb-2 inline-flex items-center gap-2 text-lg font-bold text-navy">
            <span class="grid h-8 w-8 place-items-center rounded-full bg-royal text-white">C</span>
            CivicEvents<span class="text-amber">+</span>
          </a>
          <h1 class="text-2xl font-bold text-navy">Welcome back</h1>
          <label class="block text-sm font-medium">
            Email
            <input id="email" name="email" type="email" class="ce-input" placeholder="you@example.com" required />
          </label>
          <label class="block text-sm font-medium">
            Password
            <div class="relative">
              <input id="password" name="password" type="password" class="ce-input pr-16" required />
              <button type="button" id="toggle-password-login" class="absolute right-3 top-3 text-xs text-royal">Show</button>
            </div>
          </label>
          <p class="text-xs text-slate-500">Sign in with an account created on your connected backend.</p>
          <button type="submit" class="ce-btn-primary w-full text-center">Login</button>
          <p class="text-center text-sm">New here? <a href="/pages/auth/signup.html" class="font-medium text-royal">Create an account</a></p>
        </form>
      </section>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="../../js/pages/login.js"></script>
  </body>
</html>
