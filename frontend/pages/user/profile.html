<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | CivicEvents+</title>
    <link rel="stylesheet" href="../../css/output.css" />
  </head>
  <body class="bg-gray-50 text-gray-900">
    <div id="navbar-slot"></div>
    <main class="mx-auto max-w-6xl p-4">
      <div class="mb-6">
        <h1 class="text-2xl font-bold text-navy sm:text-3xl">My Profile</h1>
      </div>
      <div class="grid gap-6 md:grid-cols-3">
        <section id="profile-summary"></section>
        <form id="profile-form" class="ce-card space-y-4 p-6 md:col-span-2">
          <label class="block text-sm font-medium">
            Full name
            <input id="full_name" name="full_name" type="text" class="ce-input" />
          </label>
          <label class="block text-sm font-medium">
            Email
            <input id="email" name="email" type="email" class="ce-input" />
          </label>
          <button type="submit" class="ce-btn-primary">Save changes</button>
        </form>
      </div>
    </main>
    <div id="footer-slot"></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="../../js/pages/profile.js"></script>
  </body>
</html>
