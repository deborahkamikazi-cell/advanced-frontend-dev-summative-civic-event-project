<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Announcement Form | CivicEvents+</title>
    <link rel="stylesheet" href="../../css/output.css" />
  </head>
  <body class="bg-gray-50 text-gray-900">
    <div id="navbar-slot"></div>
    <div id="admin-topbar-slot"></div>
    <main class="mx-auto flex max-w-7xl gap-4 p-4">
      <div id="admin-sidebar-slot" class="w-full md:w-64"></div>
      <section class="flex-1 rounded border bg-white p-4">
        <h1 id="announcement-form-title" class="text-xl font-semibold">Create Announcement</h1>
        <form id="announcement-form" class="mt-4 space-y-4" enctype="multipart/form-data">
          <label class="block text-sm font-medium">
            Announcement title
            <input id="title" name="title" type="text" placeholder="Title" class="ce-input" required />
          </label>
          <label class="block text-sm font-medium">
            Audio duration (MM:SS)
            <input id="duration" name="duration" type="text" class="ce-input" disabled aria-describedby="announcement-api-note" />
          </label>
          <label class="block text-sm font-medium">
            Audio file
            <input id="audio" name="audio" type="file" accept=".mp3,.wav,.m4a,.ogg" class="ce-input" aria-describedby="audio-help" />
          </label>
          <p id="audio-help" class="text-sm text-slate-500">Required for new announcements. MP3, WAV, M4A or OGG, up to 5 MB.</p>
          <label class="block text-sm font-medium">
            Transcript
            <textarea id="transcript" name="transcript" rows="5" class="ce-input" disabled aria-describedby="announcement-api-note"></textarea>
          </label>
          <p id="announcement-api-note" class="text-sm text-slate-500">The current API does not store duration or transcripts.</p>
          <label class="inline-flex items-center gap-2 text-sm">
            <input id="published" name="published" type="checkbox" checked />
            Published
          </label>
          <div class="flex gap-2">
            <button type="submit" class="ce-btn-primary" disabled>Save announcement</button>
            <a href="/pages/admin/manage-announcements.html" class="ce-btn-secondary">Cancel</a>
          </div>
        </form>
      </section>
    </main>
    <div id="footer-slot"></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="../../js/pages/admin/manage-announcements.js"></script>
  </body>
</html>
